services:
  - type: web
    name: technician-overtime-portal
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: supervisor
      - key: ADMIN_PASSWORD
        value: Supervisor@123
      - key: GITHUB_REPO
        value: ahammedkabeer200-spec/technician-overtime-tracking-sheet
